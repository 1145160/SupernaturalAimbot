name: Build Xyaim dylib
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set rootless
        run: echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
      - name: Install Theos & ldid
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          brew install ldid
      - name: Build tweak
        run: |
          make package
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Xyaim.deb
          path: packages/*.deb
