name: Build XyAim
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH
      - name: Build
        run: make package
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: XyAim
          path: packages/*.deb
